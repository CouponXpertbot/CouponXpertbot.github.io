name: CourseFolder Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:         # manual trigger

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements1.txt
          playwright install chromium

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_INVITE: ${{ secrets.CHANNEL_INVITE }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: override defaults
          CHECK_INTERVAL: ${{ secrets.CHECK_INTERVAL }}
          COURSE_LIMIT: ${{ secrets.COURSE_LIMIT }}
          PLAYWRIGHT_HEADLESS: ${{ secrets.PLAYWRIGHT_HEADLESS }}
          AI_ENABLED: ${{ secrets.AI_ENABLED }}
        run: python coursefolder.py
